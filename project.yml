name: Keycadence
options:
  bundleIdPrefix: com.notebrewer
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 7QL3988ZQY
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  KeycadenceEngine:
    path: Engine
targets:
  Keycadence:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: KeycadenceEngine
        product: CKeycadence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notebrewer.keycadence
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Keycadence.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OPTIMIZATION_LEVEL: "-O"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
schemes:
  Keycadence:
    build:
      targets:
        Keycadence: all
    run:
      config: Debug
    archive:
      config: Release
